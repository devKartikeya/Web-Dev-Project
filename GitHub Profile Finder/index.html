<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Finder</title>
</head>

<body>
    <div id="root">
        <header>
            <img src="https://i.pinimg.com/736x/cc/aa/09/ccaa09637389a530ddffc288a41b0895.jpg" alt="GitHub Logo"
                width="300">
        </header>
        <main>

            <aside>
                <h1>GitHub</h1>
                <h3> Profile Finder</h3>
            </aside>
            <section>
                <input id="input" type="text" placeholder="Search by Username">
                <div id="error">

                </div>
                <div id="link-container">
                    <a id="link" target="_blank"><button id="button">Search</button></a>
                </div>
            </section>
        </main>
        <footer>
            <p>Made with ❤️ by Kartikeya Mishra</p>
            <a href="https://github.com/devKartikeya" target="_blank">
                <img src="https://i.pinimg.com/736x/cc/aa/09/ccaa09637389a530ddffc288a41b0895.jpg" alt="GitHub Logo">
            </a>
        </footer>
    </div>
    <script src="script.js"></script>
</body>

</html>
